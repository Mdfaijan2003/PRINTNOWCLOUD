syntax = "proto3";

package printjob;

service PrintJobService {
  rpc GetPaymentDetails(GetPaymentDetailsRequest)
      returns (GetPaymentDetailsResponse);
}

message GetPaymentDetailsRequest {
  string print_job_id = 1;
}

message GetPaymentDetailsResponse {
  string print_job_id = 1;
  int64 amount = 2;
  string currency = 3;
  string status = 4;
}